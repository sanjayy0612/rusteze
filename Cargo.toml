[package]
name = "rusteze"
version = "0.1.0"
edition = "2021"

[dependencies]
ctrlc = "3.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10.0"
